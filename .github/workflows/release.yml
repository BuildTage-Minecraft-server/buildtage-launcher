name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read release metadata
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a version tag, not from a branch"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            CHANNEL="${VERSION#*-}"
            CHANNEL="${CHANNEL%%.*}"
          else
            PRERELEASE=false
            CHANNEL=latest
          fi
          NAME="$(node -p "require('./package.json').productName")"
          {
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "title=$NAME $GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
          done

      - name: Build installers
        run: npm run dist -- --publish never

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os == 'windows-latest' && 'unsigned-windows' || format('dist-{0}', matrix.os) }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: Sign Windows installer
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'buildtage-launcher' }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: unsigned-windows
          path: windows

      - name: Detect SignPath configuration
        id: signpath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath is not configured, the Windows installer is published unsigned"
          fi

      - name: Set up Node.js
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.signpath.outputs.enabled == 'true'
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
          done

      - name: Upload build output
        id: unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installer
          path: windows/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Refresh update metadata
        if: steps.signpath.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cp signed/*.exe windows/
          node scripts/finalize-signed-installer.js windows

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            windows/*.exe
            windows/*.blockmap
            windows/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish-r2:
    name: Publish to R2
    needs: [prepare, build, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?Add the R2_ACCOUNT_ID repository secret}"
          : "${R2_ACCESS_KEY_ID:?Add the R2_ACCESS_KEY_ID repository secret}"
          : "${R2_SECRET_ACCESS_KEY:?Add the R2_SECRET_ACCESS_KEY repository secret}"
          : "${R2_BUCKET:?Add the R2_BUCKET repository secret}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws configure set default.s3.multipart_threshold 512MB
          for attempt in 1 2 3; do
            aws s3 sync release "s3://${R2_BUCKET}/launcher" --endpoint-url "$endpoint" --exclude "latest*.yml" --cache-control "public, max-age=3600" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 10))
          done
          for manifest in release/latest*.yml; do
            name="$(basename "$manifest")"
            aws s3 cp "$manifest" "s3://${R2_BUCKET}/launcher/${name/latest/$CHANNEL}" --endpoint-url "$endpoint" --cache-control "no-cache"
          done

  publish-github:
    name: Publish GitHub release
    needs: [prepare, build, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.prepare.outputs.title }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*.exe release/*.dmg release/*.zip release/*.AppImage)
          publish() {
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
                --verify-tag \
                --generate-notes \
                --title "$TITLE" \
                --prerelease="$PRERELEASE"
            fi
          }
          for attempt in 1 2 3; do
            publish && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
          done
