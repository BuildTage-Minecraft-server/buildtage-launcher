name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read release metadata
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a version tag, not from a branch"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            CHANNEL="${VERSION#*-}"
            CHANNEL="${CHANNEL%%.*}"
          else
            PRERELEASE=false
            CHANNEL=latest
          fi
          NAME="$(node -p "require('./package.json').productName")"
          {
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "title=$NAME $GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist -- --publish never

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish-r2:
    name: Publish to R2
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?Add the R2_ACCOUNT_ID repository secret}"
          : "${R2_ACCESS_KEY_ID:?Add the R2_ACCESS_KEY_ID repository secret}"
          : "${R2_SECRET_ACCESS_KEY:?Add the R2_SECRET_ACCESS_KEY repository secret}"
          : "${R2_BUCKET:?Add the R2_BUCKET repository secret}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws configure set default.s3.multipart_threshold 512MB
          for attempt in 1 2 3; do
            aws s3 sync release "s3://${R2_BUCKET}/launcher" --endpoint-url "$endpoint" --exclude "latest*.yml" --cache-control "public, max-age=3600" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 10))
          done
          for manifest in release/latest*.yml; do
            name="$(basename "$manifest")"
            aws s3 cp "$manifest" "s3://${R2_BUCKET}/launcher/${name/latest/$CHANNEL}" --endpoint-url "$endpoint" --cache-control "no-cache"
          done

  publish-github:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.prepare.outputs.title }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*.exe release/*.dmg release/*.zip release/*.AppImage)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$TITLE" \
              --prerelease="$PRERELEASE"
          fi
