name: Auto rerun

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: Rerun on infrastructure failure
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100")"
          pattern='^(Set up job|Check out repository|Set up Node\.js|Set up Python|Install dependencies|Upload build output|Download build output|Upload to R2|Create or update the release)$'
          failed="$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<< "$jobs")"
          real="$(jq --arg re "$pattern" '[.jobs[]
            | select(.conclusion == "failure")
            | select(((.steps | length) > 0) and ([.steps[] | select(.conclusion == "failure") | .name] | all(test($re)) | not))
          ] | length' <<< "$jobs")"
          if [ "$failed" -eq 0 ] || [ "$real" -gt 0 ]; then
            echo "No infrastructure-only failures, skipping rerun"
            exit 0
          fi
          echo "Attempt $ATTEMPT failed on infrastructure, rerunning failed jobs"
          sleep 60
          gh run rerun "$RUN_ID" --failed
