appId: 'space.nekrasovdev.buildtage-launcher'
productName: 'BuildTage Launcher'
# Include architecture in artifact filenames is not here by default, we add them on each platform config if necessary for clarity
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Asesu23. Based on VIS Launcher, Copyright © 2022-2026 VI Software and contributors'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs,scripts}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch:
        - 'x64'
  # cscLink: './cert/certificate.pfx'
  # signtoolOptions:
  #   publisherName: 'VI Software'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  license: "INSTALLER-LICENSE.md"
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target:
    - target: 'AppImage'
      arch:
        - 'x64'
        - 'arm64'
  maintainer: 'Asesu23'
  vendor: 'BuildTage'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Launcher for the BuildTage servers. It keeps the game and the mod set up to date and signs you in with your game account.'
  artifactName: '${productName}-${version}-${arch}.${ext}'
  category: 'Game'
  compression: 'normal'
  executableArgs:
      - '--no-sandbox'
      - '--ozone-platform-hint=auto'

directories:
  buildResources: 'build'
  output: 'dist'

publish:
  provider: github
  owner: Asesu23
  repo: buildtage-launcher
  releaseType: release